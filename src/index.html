<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padronizador de Documentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <!-- Carregamento direto do PDF.js via CDN para evitar erros de Worker -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="folha">
    <span class="folha__aba">Modelo Doutrin</span>

    <header class="folha__cabecalho">
      <h1>Padronizador de Documentos</h1>
      <p>Envie um arquivo e receba de volta no formato padrão do Doutrin.</p>
    </header>

    <main>
      <!-- Uso do elemento label nativo para garantir o funcionamento do clique em qualquer navegador -->
      <label for="entrada-arquivo" id="zona-envio" class="drop-zone">
        <svg class="drop-zone__icone" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path d="M10 4h14l6 6v24a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M24 4v6h6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M20 30v-9M20 21l-3.5 3.5M20 21l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="mensagem-envio">Arraste e solte o arquivo aqui, ou clique para selecionar</span>
        <span class="mensagem-formatos">.pdf ou .docx</span>
        <input type="file" id="entrada-arquivo" accept=".pdf, .docx" class="hidden-input" />
      </label>

      <div id="painel-status" class="status-panel hidden">
        <div id="indicador-carregamento" class="spinner"></div>
        <p id="texto-status">Processando arquivo...</p>
      </div>

      <div id="painel-resultado" class="result-panel hidden">
        <svg class="result-panel__icone" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="12.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8.5 14.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3>Documento processado com sucesso</h3>
        <p id="informacao-arquivo"></p>
        <button id="botao-baixar" class="btn">Baixar DOCX padronizado</button>
      </div>

      <div id="painel-erro" class="error-panel hidden">
        <svg class="error-panel__icone" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 22 20H2L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 10v4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="17.5" r="0.9" fill="currentColor"/>
        </svg>
        <p id="texto-erro" class="error-message"></p>
      </div>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
